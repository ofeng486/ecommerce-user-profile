spring.application.name=ecommerce-user-profile-v2-backend

# 服务端口
server.port=${SERVER_PORT:8080}

# 请求体大小限制（安全：防大 payload 攻击）
server.max-http-request-header-size=16KB

# 文件上传大小限制（CSV 导入用）
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# MySQL 连接（环境变量管理）
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_user_profile?rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:of040806}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.data-source-properties.useUnicode=true
spring.datasource.hikari.data-source-properties.characterEncoding=UTF-8
spring.datasource.hikari.data-source-properties.serverTimezone=Asia/Shanghai
# Hikari 连接池优化（导入场景）
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# MyBatis-Plus 配置
mybatis-plus.mapper-locations=classpath:mapper/*.xml
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto
# 首次开发用 update 自动建表，正式环境改为 validate
mybatis-plus.global-config.db-config.table-underline=true

# JWT 配置（环境变量管理，生产至少 32 字节）
security.jwt.secret=v2-dev-jwt-secret-key-for-local-development-only-please-change-in-production
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:7200}
security.jwt.issuer=ecommerce-user-profile-v2

# Knife4j / Swagger 文档
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
knife4j.enable=true

# Session 不参与 JWT 无状态认证
spring.session.store-type=none

# ─── Spark 画像管线配置 ───
# PySpark 本地管线脚本路径（相对于 backend 工作目录，即 v2/bigdata-scripts/）
spark.pipeline.script-path=${SPARK_SCRIPT_PATH:../bigdata-scripts/spark/run_local_pipeline.py}
# CSV 输入数据目录（数据生成后的 CSV 存放位置，Spark 画像任务也读这个目录）
spark.pipeline.import-dir=${SPARK_IMPORT_DIR:../bigdata-scripts/generated-data}
# MySQL 连接信息（Spark JDBC 写入用）
spark.pipeline.mysql-user=${DB_USERNAME:root}
spark.pipeline.jdbc-url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_user_profile}
# Java 17 路径（优先环境变量，否则使用当前 JVM 路径——跨平台兼容）
spark.pipeline.java-home=${JAVA_HOME_17:${java.home}}

# ─── 数据生成器配置 ───
# Python 数据生成脚本路径（相对于 backend 工作目录）
data.generator.script-path=${DATA_GEN_SCRIPT:../bigdata-scripts/generate_data.py}
# Python 可执行文件路径（默认依赖 PATH 中的 python3，跨平台兼容）
data.generator.python-path=${PYTHON_PATH:python3}

# ─── AI 智能分析配置 ───
# LLM 提供商：deepseek（默认）| qwen | openai（均为 OpenAI 兼容协议）
ai.llm.api-key=${AI_API_KEY:sk-70ad0bf9850b447183a8be0e1b55799b}
ai.llm.base-url=${AI_LLM_BASE_URL:https://api.deepseek.com}
ai.llm.model=${AI_LLM_MODEL:deepseek-chat}
