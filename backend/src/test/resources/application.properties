# 测试环境使用 H2 内存数据库
spring.datasource.url=jdbc:h2:mem:ecommerce_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# MyBatis-Plus —— 测试环境不打印 SQL（可按需开启）
mybatis-plus.configuration.log-impl=
mybatis-plus.global-config.db-config.id-type=auto

# JWT 测试密钥
security.jwt.secret=test-secret-key-for-v2-integration-tests-minimum-256bits
security.jwt.expiration-seconds=3600
security.jwt.issuer=ecommerce-user-profile-v2-test

# Knife4j 测试关闭
knife4j.enable=false
springdoc.api-docs.enabled=false
